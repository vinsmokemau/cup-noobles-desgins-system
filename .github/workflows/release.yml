# Release (T11.3, REQ-070, SPEC.md §4.8): when changes reach `main`, this opens or updates the "Version packages" pull
# request. Merging it bumps the three packages in lockstep and updates CHANGELOG.md (`pnpm version-packages`).
# Publishing to GitHub Packages and tagging are T12.1; no `publish` command is set here on purpose.
# Setup the owner does once, in the repository settings: Settings > Actions > General > Workflow permissions >
# "Allow GitHub Actions to create and approve pull requests".
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

# One run at a time. A newer push waits, so two runs never fight over the version branch.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: version packages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Reads the pnpm version from `packageManager` in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm version-packages
          title: Version packages
          commit: Version packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
